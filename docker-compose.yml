services:
  web: 
    # ビルドの起点とつなぐ場所はリポジトリ直下。workspacesのロックファイルとshared/が直下にあるため(2026-10-24 P3)
    build: 
      context: .
      dockerfile: front/Dockerfile
    container_name: sinsakai-huyu-front
    working_dir: /app/front
    ports: 
      - "4545:4545"
    volumes: 
      - .:/app
      # node_modulesはコンテナの中の名前の無いボリュームに置き、Macの側と混ぜない
      - /app/node_modules
      - /app/front/node_modules
    env_file:
      - .env
    environment:
      # Macのフォルダをコンテナに入れると、変更の通知がときどき落ちる。定期的に見に行く(Next.jsの開発サーバー)
      WATCHPACK_POLLING: "true"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: back/Dockerfile
    container_name: sinsakai-huyu-api
    working_dir: /app/back
    ports:
      - "5454:5454"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/back/node_modules
    env_file:
      - .env
    environment:
      # Macのフォルダをコンテナに入れると、変更の通知がときどき落ち、tsx watchが古いコードのまま動く
      # (2026-10-23に起きた)。定期的に見に行く
      CHOKIDAR_USEPOLLING: "true"
    # command: sh -c "npx prisma migrate dev --name init && npm run dev"
    depends_on:
      db:
        condition: service_healthy


  studio:
      build:
        context: .
        dockerfile: back/Dockerfile
      container_name: sinsakai-huyu-studio
      working_dir: /app/back
      ports:
        - "5555:5555"
      volumes:
        - .:/app
        - /app/node_modules
        - /app/back/node_modules
      env_file:
        - .env
      # アプリ（api）と同じDBを見るように設定
      depends_on:
        db:
          condition: service_healthy
      # ここで起動コマンドを上書きする
      command: npx prisma studio --port 5555 --browser none

  # 開発のときに認証コードのメールを受け取る(外には送らない)。届いたメールは http://localhost:8025 で見る。
  # コードはDBにハッシュでしか置かないので、DBを見ても分からないため(2026-10-29 S1)。
  # SMTP(1025)はコンテナの間だけで使い、Macには出さない。見る画面もMacの中からだけ開ける
  mailpit:
    image: axllent/mailpit:v1.24.1
    container_name: sinsakai-huyu-mailpit
    ports:
      - "127.0.0.1:8025:8025"
      
  db: 
    image: postgres:16
    container_name: sinsakai-huyu-db
    ports: 
      - "1919:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sinsakai-huyu-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    
    healthcheck:              # 追加：これがないとapiが起動に失敗します
      test: ["CMD-SHELL", "pg_isready -U postgres -d sinsakai-huyu-db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes: 
  pgdata: